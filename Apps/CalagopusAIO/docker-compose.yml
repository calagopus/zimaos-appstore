name: calagopus-aio

services:
  web:
    image: ghcr.io/calagopus/panel:1.2.4-aio
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -s /var/lib/calagopus/.encryption-key ] || (umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /var/lib/calagopus/.encryption-key)
        export APP_ENCRYPTION_KEY="$(cat /var/lib/calagopus/.encryption-key)"
        exec /usr/bin/panel-rs "$$@"
      - panel-rs
    stop_grace_period: 1m
    environment:
      - TZ=$TZ
      - REDIS_URL=redis://cache
      - DATABASE_URL=postgresql://panel:panel@db/panel
      - DATABASE_MIGRATE=true
      - PORT=8000
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AIO_BASE_WINGS_CONFIGURATION=/etc/calagopus-aio/wings-config.yml
      - APP_DEBUG=false
      - APP_LOG_DIRECTORY=/var/log/calagopus
      - APP_PRIMARY=true
      - APP_ENABLE_WINGS_PROXY=true
      - APP_USE_DECRYPTION_CACHE=true
      - APP_USE_INTERNAL_CACHE=true
    ports:
      - target: "8000"
        published: "8000"
      - target: "2022"
        published: "2022"
    volumes:
      # --- panel
      - /DATA/AppData/$AppID/data:/var/lib/calagopus
      - /DATA/AppData/$AppID/logs:/var/log/calagopus

      # --- wings
      - /DATA/AppData/$AppID/wings-base:/etc/calagopus-aio
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/AppData/$AppID/wings-etc:/etc/calagopus-wings
      - /DATA/AppData/$AppID/wings-logs:/var/log/calagopus-wings
      - /DATA/AppData/$AppID/wings:/var/lib/calagopus-wings
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    x-casaos:
      envs:
        - container: APP_ENCRYPTION_KEY
          description:
            en_US: Key used to encrypt sensitive data. Leave empty to generate one automatically on first start (stored in the panel data folder). Never change it after installation.
        - container: APP_ENABLE_WINGS_PROXY
          description:
            en_US: Proxy user requests to Wings nodes through the panel. Simplifies home network setups, not recommended for many nodes or high traffic.
        - container: APP_USE_DECRYPTION_CACHE
          description:
            en_US: Cache decrypted values in memory and Redis to improve performance. Can be considered less secure.
        - container: APP_USE_INTERNAL_CACHE
          description:
            en_US: Cache short-lived values in app memory as well as Redis. Improves performance at the cost of memory usage.
      volumes:
        - container: /var/lib/calagopus
          description:
            en_US: Panel data.
        - container: /var/log/calagopus
          description:
            en_US: Panel logs.
        - container: /etc/calagopus-aio
          description:
            en_US: Base configuration for the integrated Wings node (wings-config.yml).
        - container: /var/run/docker.sock
          description:
            en_US: Docker socket, used by the integrated Wings node to run game servers.
        - container: /etc/calagopus-wings
          description:
            en_US: Integrated Wings node configuration.
        - container: /var/log/calagopus-wings
          description:
            en_US: Integrated Wings node logs.
        - container: /var/lib/calagopus-wings
          description:
            en_US: Game server files, backups and file history.
      ports:
        - container: "8000"
          description:
            en_US: Web UI port.
        - container: "2022"
          description:
            en_US: SFTP port of the integrated Wings node.
    networks:
      - calagopus

  db:
    image: ghcr.io/calagopus/pgautoupgrade:18-alpine
    restart: unless-stopped
    environment:
      - TZ=$TZ
      - POSTGRES_USER=panel
      - POSTGRES_PASSWORD=panel
      - POSTGRES_DB=panel
      - PGDATA=/data
    volumes:
      - /DATA/AppData/$AppID/postgres:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - calagopus

  cache:
    image: ghcr.io/calagopus/valkey:latest
    restart: unless-stopped
    command: --protected-mode no --save 60 1
    environment:
      TZ: $TZ
    volumes:
      - /DATA/AppData/$AppID/cache:/data
    networks:
      - calagopus

networks:
  calagopus:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  id: com.calagopus.panel.aio
  main: web
  version: "1.2.4"
  update_at: "2026-10-04"
  release_notes:
    en_US: |-
      See https://github.com/calagopus/panel/releases/tag/release-1.2.4
  index: /
  scheme: http
  port_map: "8000"
  category: Developer
  author: Calagopus
  developer: Calagopus
  website: https://calagopus.com
  repo: https://github.com/calagopus/panel
  docs: https://calagopus.com/docs
  support: https://github.com/calagopus/panel/issues
  icon: https://cdn.jsdelivr.net/gh/calagopus/zimaos-appstore@main/Apps/CalagopusAIO/icon.svg
  thumbnail: ""
  title:
    en_US: Calagopus AIO
  tagline:
    en_US: Game server panel with a built-in Wings node, ready to run servers
  description:
    en_US: |
      Calagopus is a modern, open-source game server management panel built with Rust and React. Deploy, monitor, and manage Minecraft, Hytale, and other game servers with industry-leading performance.

      Calagopus comes in three variants:

      - **Calagopus**: just the panel. Connect one or more separate Wings nodes to run game servers.
      - **Calagopus AIO**: the panel plus an integrated Wings node, so you can create and run game servers on this device right away. The best choice for most people.
      - **Calagopus Heavy AIO**: everything in AIO, plus the toolchain to compile backend extensions on the device. Only pick this if you need backend extensions.

      You are viewing: **Calagopus AIO**.
  tips:
    before_install:
      en_US: |
        An encryption key is generated automatically on first start and stored in `/DATA/AppData/<app>/data/.encryption-key`. Back it up together with the database: without it, encrypted data cannot be recovered.

        To use your own key instead, set `APP_ENCRYPTION_KEY` before the first start. Do **not** change it after installation.

        This app needs access to the Docker socket to run game servers, and uses port `2022` for SFTP. Install only one Calagopus AIO variant at a time.
