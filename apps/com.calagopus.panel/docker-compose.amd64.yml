name: calagopus

services:
  web:
    image: ghcr.io/calagopus/panel:1.2.9@sha256:62a2cec11718a686351397567aa483855748557dce1713a9182aa4454e775cd0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -s /var/lib/calagopus/.encryption-key ] || (umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /var/lib/calagopus/.encryption-key)
        export APP_ENCRYPTION_KEY="$(cat /var/lib/calagopus/.encryption-key)"
        exec /usr/bin/panel-rs "$$@"
      - panel-rs
    environment:
      - TZ=$TZ
      - REDIS_URL=redis://cache
      - DATABASE_URL=postgresql://panel:panel@db/panel
      - DATABASE_MIGRATE=true
      - PORT=8000
      - APP_DEBUG=false
      - APP_LOG_DIRECTORY=/var/log/calagopus
      - APP_PRIMARY=true
      - APP_ENABLE_WINGS_PROXY=true
      - APP_USE_DECRYPTION_CACHE=true
      - APP_USE_INTERNAL_CACHE=true
    ports:
      - target: "8000"
        published: "8000"
    volumes:
      - /DATA/AppData/$AppID/data:/var/lib/calagopus
      - /DATA/AppData/$AppID/logs:/var/log/calagopus
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - calagopus
  db:
    image: ghcr.io/calagopus/pgautoupgrade:18-alpine@sha256:1e09e8e3f0c185badb10956f752a03e7fe06b150bfda673b32529c6d03bd9d32
    restart: unless-stopped
    environment:
      - TZ=$TZ
      - POSTGRES_USER=panel
      - POSTGRES_PASSWORD=panel
      - POSTGRES_DB=panel
      - PGDATA=/data
    volumes:
      - /DATA/AppData/$AppID/postgres:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - calagopus

  cache:
    image: ghcr.io/calagopus/valkey:latest@sha256:c804dff57f44f499b0a46c4e56fc5dbfffb919df0ec6e6a3a22d94d4300704fb
    restart: unless-stopped
    command: --protected-mode no --save 60 1
    environment:
      TZ: $TZ
    volumes:
      - /DATA/AppData/$AppID/cache:/data
    networks:
      - calagopus

networks:
  calagopus:
    driver: bridge

x-casaos:
  id: com.calagopus.panel
  main: web
  version: "1.2.9"
  index: /
  scheme: http
  port_map: "8000"
  icon: https://calagopus.github.io/zimaos-appstore/apps/com.calagopus.panel/assets/icon.svg
  title:
    en_US: Calagopus
